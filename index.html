<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Little Meadow</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#9bb88a">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#6f9460;font:700 15px/1.35 "Courier New",ui-monospace,monospace;color:#5c3f2b}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.px,.pn{background:#f6ecd6;border:3px solid #8a6144;box-shadow:inset 0 0 0 2px #e3d2b0,0 3px 0 #5c3f2b;border-radius:4px}
button{font:inherit;color:#5c3f2b;background:#e6a9b4;border:3px solid #8a6144;box-shadow:0 3px 0 #5c3f2b;border-radius:4px;padding:10px 14px;min-height:48px;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:none}button:disabled{opacity:.4}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
#hud .px{padding:4px 8px;display:flex;align-items:center;gap:6px}
.ic{width:16px;height:16px;image-rendering:pixelated}
#menu{pointer-events:auto;margin-left:auto;min-height:40px;padding:4px 12px;background:#f6ecd6}
#pad{position:fixed;left:14px;bottom:max(20px,env(safe-area-inset-bottom));width:174px;height:174px;display:grid;grid-template:repeat(3,58px)/repeat(3,58px)}
#pad button{padding:0;min-height:0;font-size:22px;background:#f6ecd6;opacity:.93}
#acts{position:fixed;right:12px;bottom:max(20px,env(safe-area-inset-bottom));width:112px;display:flex;flex-direction:column;gap:8px}
#hint{position:fixed;left:8px;right:8px;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 184px);text-align:center;pointer-events:none}
#hint span{display:inline-block;padding:4px 10px}
#toast{position:fixed;top:92px;left:50%;transform:translateX(-50%);max-width:90%;padding:8px 12px;text-align:center;display:none;pointer-events:none}
#toast.on{display:block}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(60,70,50,.5);padding:14px;overflow:auto}
#ov,#ov *{touch-action:pan-y}#ov input{touch-action:pan-x}
#ov.on{display:flex}
.pn{width:100%;max-width:380px;padding:16px;margin:auto}
.pn h2{margin:0 0 8px;font-size:22px}.pn h3{margin:12px 0 4px;color:#c76f7e}.pn p{margin:6px 0}
.col{display:flex;flex-direction:column;gap:10px;margin-top:12px}.c{text-align:center}
.logo{font-size:44px;line-height:1;text-align:center;color:#c76f7e;text-shadow:3px 3px 0 #8a6144;margin:8px 0 12px;letter-spacing:2px}
.l{font-size:13px;border-left:3px solid #e6a9b4;padding-left:8px}
canvas#pv{display:block;margin:6px auto;width:128px;height:128px;image-rendering:pixelated;border:3px solid #8a6144}
.sws{display:flex;gap:8px;justify-content:center}.sws i{width:42px;height:42px;border:3px solid #8a6144;border-radius:4px}.sws i.on{outline:3px solid #c76f7e}
input[type=range]{width:100%;height:36px}
body.title #hud,body.title #pad,body.title #acts,body.title #hint{display:none}
</style></head><body class="title">
<canvas id="cv"></canvas>
<div id="hud"><div class="px"><img class="ic" id="i1" alt=""><b id="co">0</b></div><div class="px"><img class="ic" id="i2" alt=""><b id="sd">0</b></div><div class="px"><img class="ic" id="i3" alt=""><b id="cr">0</b></div><button id="menu">Menu</button><div class="px" id="tm"></div></div>
<div id="hint"><span class="px" id="ht"></span></div><div id="toast" class="px"></div>
<div id="pad"><button data-k="u" style="grid-area:1/2">&#9650;</button><button data-k="l" style="grid-area:2/1">&#9664;</button><button data-k="r" style="grid-area:2/3">&#9654;</button><button data-k="d" style="grid-area:3/2">&#9660;</button></div>
<div id="acts"><button id="bm" style="display:none;background:#f2d27a">Market</button><button id="bp">Plant</button><button id="bw" style="background:#a9d0e0">Water</button><button id="bh" style="background:#b9d9a0">Pick</button></div>
<div id="ov"></div>
<script src="game.js"></script></body></html>
